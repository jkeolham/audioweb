<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title id="page-title">텍스트 → mp3</title>
  <link rel="stylesheet" href="./src/style.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#121212">
</head>
<body>
  <main>
    <header class="top-bar">
      <a id="back-link" href="./">← AudioWeb</a>
      <button id="lang-btn" class="lang-btn" type="button">🌐 English</button>
    </header>
    <h1 id="title">텍스트 → mp3</h1>
    <textarea id="text" placeholder="영어 텍스트를 입력하세요"></textarea>
    <div class="row">
      <select id="voice" style="width:auto"></select>
      <label class="dim"><span id="speed-label">속도</span> <input id="speed" type="range" min="0.6" max="1.5" step="0.1" value="1"> <span id="speedv">1.0x</span></label>
    </div>
    <div class="row">
      <button id="go">mp3 만들기</button>
    </div>
    <progress id="bar" value="0" max="1" hidden></progress>
    <p id="status" class="dim"></p>
    <audio id="player" controls hidden></audio>
    <div class="row">
      <a id="dl" class="btn" hidden>mp3 다운로드</a>
    </div>
  </main>
  <script type="module" src="./src/tts-main.js"></script>
  <script type="module" src="./src/sw-register.js"></script>
</body>
</html>
