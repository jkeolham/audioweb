<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title id="page-title">mp3 → 텍스트</title>
  <link rel="stylesheet" href="./src/style.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#121212">
</head>
<body>
  <main>
    <header class="top-bar">
      <a id="back-link" href="./">← AudioWeb</a>
      <button id="lang-btn" class="lang-btn" type="button">🌐 English</button>
    </header>
    <h1 id="title">mp3 → 텍스트</h1>
    <input id="file" type="file" accept="audio/*,.mp3">
    <progress id="bar" value="0" max="1" hidden></progress>
    <p id="status" class="dim">전화영어 mp3(영어, 1:1)를 선택하세요. 먼저 거는 쪽(첫 발화)을 강사로 간주합니다.</p>
    <div id="tools" class="row" hidden>
      <button id="flip" class="ghost">라벨 전체 반전</button>
      <button id="save">저장</button>
      <button id="txt" class="ghost">.txt 다운로드</button>
    </div>
    <div id="turns"></div>
    <h2 id="history-title">저장한 기록</h2>
    <div id="history"></div>
  </main>
  <script type="module" src="./src/stt-main.js"></script>
  <script type="module" src="./src/sw-register.js"></script>
</body>
</html>
