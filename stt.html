<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title id="page-title">mp3 → 텍스트</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#121212">
  <script type="module" crossorigin src="./assets/stt-XqyuGaml.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/sw-register-Bo4T6PsU.js">
  <link rel="stylesheet" crossorigin href="./assets/sw-register-4KOlW4PX.css">
</head>
<body>
  <main>
    <header class="top-bar">
      <a id="back-link" href="./">← AudioWeb</a>
      <button id="lang-btn" class="lang-btn" type="button">🌐 English</button>
    </header>
    <h1 id="title">mp3 → 텍스트</h1>
    <div class="file-picker" id="file-picker">
      <label for="file" class="file-btn" id="file-btn">파일 선택</label>
      <span id="file-name" class="file-name dim">선택된 파일 없음</span>
      <input id="file" type="file" accept="audio/*,.mp3" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0,0,0,0)">
    </div>
    <progress id="bar" value="0" max="1" hidden></progress>
    <p id="status" class="dim">전화영어 mp3(영어, 1:1)를 선택하세요. 먼저 거는 쪽(첫 발화)을 강사로 간주합니다.</p>
    <div id="tools" class="row" hidden>
      <button id="flip" class="ghost">라벨 전체 반전</button>
      <button id="save">저장</button>
      <button id="txt" class="ghost">.txt 다운로드</button>
    </div>
    <div id="turns"></div>
    <h2 id="history-title">저장한 기록</h2>
    <div id="history"></div>
  </main>
</body>
</html>
